
name: Build Haru Planner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o haru_planner_2_android_source.zip

      - name: Build APK
        working-directory: haru_planner_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaruPlanner-APK
          path: haru_planner_android/app/build/outputs/apk/debug/app-debug.apk
